<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-label="Five OLAP operations explained">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9faff"/><stop offset="1" stop-color="#ebeaff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9076fc"/><stop offset="1" stop-color="#4f42b6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#1b1b57" flood-opacity=".11"/></filter></defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<text x="92" y="110" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="60" fill="#242442" text-anchor="start">Five OLAP Operations</text><text x="95" y="164" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="27" fill="#727996" text-anchor="start">The same sales dataset, five different analytical perspectives.</text><rect x="85" y="223" width="470" height="260" rx="22" fill="#ffffff" filter="url(#shadow)"/><rect x="110" y="250" width="57" height="43" rx="12" fill="#ede9ff"/><text x="138" y="280" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#6a56d2" text-anchor="middle">01</text><text x="112" y="338" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="32" fill="#2c2a4d" text-anchor="start">SLICE</text><text x="112" y="376" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="#6f758f" text-anchor="start">Fix a single dimension</text><rect x="111" y="413" width="418" height="44" rx="9" fill="#f4f4ff"/><text x="125" y="443" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" fill="#6252be" text-anchor="start">Category = Electronics</text><rect x="590" y="223" width="470" height="260" rx="22" fill="#ffffff" filter="url(#shadow)"/><rect x="615" y="250" width="57" height="43" rx="12" fill="#ede9ff"/><text x="643" y="280" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#6a56d2" text-anchor="middle">02</text><text x="617" y="338" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="32" fill="#2c2a4d" text-anchor="start">DICE</text><text x="617" y="376" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="#6f758f" text-anchor="start">Restrict several dimensions</text><rect x="616" y="413" width="418" height="44" rx="9" fill="#f4f4ff"/><text x="630" y="443" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" fill="#6252be" text-anchor="start">North/West + Online/Partner</text><rect x="1095" y="223" width="470" height="260" rx="22" fill="#ffffff" filter="url(#shadow)"/><rect x="1120" y="250" width="57" height="43" rx="12" fill="#ede9ff"/><text x="1148" y="280" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#6a56d2" text-anchor="middle">03</text><text x="1122" y="338" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="32" fill="#2c2a4d" text-anchor="start">DRILL-DOWN</text><text x="1122" y="376" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="#6f758f" text-anchor="start">Explore finer details</text><rect x="1121" y="413" width="418" height="44" rx="9" fill="#f4f4ff"/><text x="1135" y="443" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" fill="#6252be" text-anchor="start">Category → Product</text><rect x="85" y="535" width="470" height="260" rx="22" fill="#ffffff" filter="url(#shadow)"/><rect x="110" y="562" width="57" height="43" rx="12" fill="#ede9ff"/><text x="138" y="592" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#6a56d2" text-anchor="middle">04</text><text x="112" y="650" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="32" fill="#2c2a4d" text-anchor="start">ROLL-UP</text><text x="112" y="688" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="#6f758f" text-anchor="start">Create higher-level totals</text><rect x="111" y="725" width="418" height="44" rx="9" fill="#f4f4ff"/><text x="125" y="755" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" fill="#6252be" text-anchor="start">Region / Category / All</text><rect x="590" y="535" width="470" height="260" rx="22" fill="#ffffff" filter="url(#shadow)"/><rect x="615" y="562" width="57" height="43" rx="12" fill="#ede9ff"/><text x="643" y="592" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="23" fill="#6a56d2" text-anchor="middle">05</text><text x="617" y="650" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="32" fill="#2c2a4d" text-anchor="start">PIVOT</text><text x="617" y="688" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22" fill="#6f758f" text-anchor="start">Rotate a cross-tab</text><rect x="616" y="725" width="418" height="44" rx="9" fill="#f4f4ff"/><text x="630" y="755" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="20" fill="#6252be" text-anchor="start">Regions × Sales channels</text><text x="115" y="884" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="23" fill="#8588a0" text-anchor="start">Queries are executed on the sales table in DuckDB-Wasm.</text></svg>