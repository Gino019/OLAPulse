<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-label="Architecture diagram: OLAPulse DuckDB-Wasm in the browser deployed on GitHub Pages">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9faff"/><stop offset="1" stop-color="#ebeaff"/></linearGradient><linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9076fc"/><stop offset="1" stop-color="#4f42b6"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#1b1b57" flood-opacity=".11"/></filter></defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<text x="100" y="116" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="64" fill="#282342" text-anchor="start">OLAPulse Architecture</text><text x="102" y="171" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="27" fill="#7a819b" text-anchor="start">No application server. No AWS. SQL analysis happens inside the browser.</text><rect x="80" y="235" width="1440" height="500" rx="22" fill="#ffffff" filter="url(#shadow)"/><text x="122" y="284" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="18" fill="#8775c9" text-anchor="start">PUBLIC CLOUD / SAAS</text><rect x="118" y="333" width="330" height="320" rx="22" fill="#f9f8ff" filter="url(#shadow)"/><text x="155" y="396" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="44" fill="#332c64" text-anchor="start">GitHub</text><text x="155" y="444" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="22" fill="#6a6788" text-anchor="start">Repository (public)</text><text x="155" y="497" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="24" fill="#6855cc" text-anchor="start">GitHub Actions</text><text x="155" y="539" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#79778d" text-anchor="start">Tests + Vite build</text><text x="155" y="575" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="19" fill="#79778d" text-anchor="start">Automatic deployment</text><rect x="630" y="333" width="335" height="320" rx="22" fill="#f9f8ff" filter="url(#shadow)"/><text x="669" y="396" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="37" fill="#332c64" text-anchor="start">GitHub Pages</text><text x="670" y="449" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="22" fill="#6a6788" text-anchor="start">Public HTTPS website</text><text x="670" y="499" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#79778d" text-anchor="start">HTML / CSS / JavaScript</text><text x="670" y="540" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#79778d" text-anchor="start">Charts + UI bundle</text><rect x="1146" y="333" width="328" height="320" rx="22" fill="#f9f8ff" filter="url(#shadow)"/><text x="1183" y="392" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="34" fill="#332c64" text-anchor="start">User Browser</text><text x="1183" y="442" font-family="Arial,Helvetica,sans-serif" font-weight="750" font-size="25" fill="#6855cc" text-anchor="start">DuckDB-Wasm</text><text x="1183" y="483" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#79778d" text-anchor="start">OLAP SQL queries</text><text x="1183" y="524" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#79778d" text-anchor="start">CSV: 4,800 sales</text><text x="1183" y="565" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="20" fill="#79778d" text-anchor="start">Chart.js visualizations</text><path d="M 449 493 H 624" fill="none" stroke="#7b69db" stroke-width="7" stroke-linecap="round"/><path d="M 606 478 L624 493 L606 508" fill="none" stroke="#7b69db" stroke-width="7" stroke-linejoin="round"/><path d="M 969 493 H 1140" fill="none" stroke="#7b69db" stroke-width="7" stroke-linecap="round"/><path d="M 1122 478 L1140 493 L1122 508" fill="none" stroke="#7b69db" stroke-width="7" stroke-linejoin="round"/><text x="775" y="805" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="25" fill="#76738e" text-anchor="middle">Browser-local analytics · Reproducible synthetic dataset · Automated CI/CD</text></svg>